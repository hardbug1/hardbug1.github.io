<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>날날이 — 음력 일력 달력</title>
<meta name="description" content="하루 한 장, 넘기는 종이 달력. 음력과 24절기, 공휴일과 대체공휴일을 한지 감성으로.">
<link rel="icon" href="icon.png">
<style>
  :root {
    --paper: #efe7d6;
    --paper-deep: #e6dcc6;
    --ink: #2b2723;
    --ink-soft: #6b6154;
    --red: #b0402f;
    --line: rgba(43,39,35,.14);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Apple SD Gothic Neo", "Noto Sans KR", -apple-system, BlinkMacSystemFont, sans-serif;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  .sheet {
    max-width: 680px;
    margin: 0 auto;
    padding: clamp(3rem, 8vw, 6rem) 1.5rem 4rem;
  }
  header { display: flex; gap: 1.25rem; align-items: center; }
  header img { width: 84px; height: 84px; border-radius: 19px; box-shadow: 0 6px 18px rgba(43,39,35,.16); }
  h1 { font-size: clamp(1.6rem, 4.5vw, 2.1rem); margin: 0 0 .2rem; letter-spacing: -.02em; }
  .tagline { color: var(--ink-soft); margin: 0; font-size: 1rem; }
  .rule { height: 1px; background: var(--line); margin: 2.5rem 0; }
  h2 { font-size: 1rem; letter-spacing: .04em; color: var(--ink-soft); font-weight: 600; margin: 0 0 .75rem; }
  ul { margin: 0; padding-left: 1.1rem; }
  li { margin-bottom: .35rem; }
  .cta {
    display: inline-block; margin-top: 1.5rem; padding: .8rem 1.6rem;
    background: var(--ink); color: var(--paper); border-radius: 999px;
    text-decoration: none; font-weight: 600; letter-spacing: -.01em;
  }
  .cta:hover { background: var(--red); }
  .links { display: flex; flex-wrap: wrap; gap: 1.25rem; margin-top: .5rem; }
  .links a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); padding-bottom: 1px; }
  .links a:hover { color: var(--red); border-color: var(--red); }
  footer { margin-top: 3.5rem; color: var(--ink-soft); font-size: .85rem; }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #201d1a; --paper-deep: #17150f; --ink: #ece4d4; --ink-soft: #a1978a; --line: rgba(236,228,212,.16); }
  }
</style>
</head>
<body>
<main class="sheet">
  <header>
    <img src="icon.png" alt="날날이 앱 아이콘" width="84" height="84">
    <div>
      <h1>날날이</h1>
      <p class="tagline">하루 한 장, 넘기는 종이 달력</p>
    </div>
  </header>

  <div class="rule"></div>

  <p>벽에 걸린 일력을 넘기던 감성을 iPhone과 Mac에 담았습니다.
     오늘 날짜를 큼직하게, 음력과 24절기·공휴일을 한지 질감 위에 정갈한 한글 글씨체로 보여드립니다.</p>

  <ul>
    <li>음력 날짜와 24절기, 공휴일·대체공휴일</li>
    <li>일력 · 월력 · 연력 세 가지 보기</li>
    <li>내 일정과 D-day, 홈 화면 위젯</li>
    <li>계정도 서버도 없이 기기에 저장</li>
  </ul>

  <a class="cta" href="https://apps.apple.com/kr/app/id6797797667">App Store에서 보기</a>

  <div class="rule"></div>

  <h2>도움말</h2>
  <div class="links">
    <a href="https://gist.github.com/hardbug1/c94ee6738d46cb981f95022e64af204a">지원 · 문의</a>
    <a href="https://gist.github.com/hardbug1/85fae5755b7dc292823fa43f1d35a768">개인정보처리방침</a>
    <a href="mailto:hardbug@naver.com">hardbug@naver.com</a>
  </div>

  <footer>© 2026 Lyncela</footer>
</main>
</body>
</html>
